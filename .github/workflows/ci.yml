name: ci

on:
  push:
  pull_request:

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]   # pinned: no silent image upgrades
        cc: [gcc, clang]
        exclude:
          - os: macos-15
            cc: gcc            # gcc is clang on macOS runners
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: tests (virtual time, threads, generator, contract) and examples
        run: make all
      - name: AddressSanitizer + UBSan
        run: make test-san
      - name: ThreadSanitizer
        run: make test-tsan
      - name: CMake
        run: cmake -S . -B build/cmake && cmake --build build/cmake && ./build/cmake/manual_cfg

  avr:
    # Arduino Nano (ATmega328P) platform: firmware must build warning-free.
    # Simulation/hardware results are recorded in platform/avr_nano/README.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: install avr-gcc and simavr
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr simavr
      - name: build contract and demo firmware
        run: |
          make -C platform/avr_nano build/contract.hex build/demo.hex
          avr-size platform/avr_nano/build/contract.elf platform/avr_nano/build/demo.elf
      - name: contract suite in simavr
        run: make -C platform/avr_nano ci-sim-contract
      - name: kernel demo in simavr
        run: make -C platform/avr_nano ci-sim-demo
